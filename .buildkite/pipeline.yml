steps:
  - wait: ~
  - label: "build-docker-x86_64"
    key: "build-docker-x86_64"
    commands:
      - "./scripts/dev_build.sh --docker"
    agents:
      queue: "self-hosted-linux-x86-64"
  - label: "push-docker-x86_64"
    key: "push-docker-x86_64"
    depends_on: "build-docker-x86_64"
    commands:
      - "./scripts/dev_push.sh --docker"
    branches: "main"
    agents:
      queue: "self-hosted-linux-x86-64"
  - label: "release-docker-x86_64"
    key: "release-docker-x86_64"
    depends_on: "build-docker-x86_64"
    commands:
      - "./scripts/dev_release.sh --release --docker"
    branches: "release/*"
    agents:
      queue: "self-hosted-linux-x86-64"

secrets:
  - CI_AWS_SECRET_ACCESS_KEY
  - CI_AWS_ACCESS_KEY_ID
